<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; margin: 0; padding: 0; display: flex; justify-content: center; }
    .container { width: min(540px, 90vw); margin: 40px 0; background: #ffffff; border-radius: 16px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08); padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 1.9rem; }
    .actions { display: grid; gap: 12px; margin-bottom: 18px; }
    .actions input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 1rem; }
    .actions button { padding: 12px 16px; border: none; border-radius: 12px; background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
    .filters { display: flex; gap: 8px; margin-bottom: 18px; }
    .filters button { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 999px; background: #fff; cursor: pointer; }
    .filters button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .task-list { list-style: none; padding: 0; margin: 0; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 10px; background: #f8fafc; }
    .task-item.completed { background: #ecfdf5; color: #065f46; text-decoration: line-through; }
    .task-item span { flex: 1; margin-left: 12px; }
    .task-action { cursor: pointer; border: none; background: transparent; color: #2563eb; font-weight: 600; }
    .empty { text-align: center; color: #6b7280; padding: 24px 0; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Task Manager</h1>
    <div class="actions">
      <input id="taskInput" type="text" placeholder="Add a new task" />
      <button id="addTaskBtn">Add Task</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <ul id="taskList" class="task-list"></ul>
  </main>

  <script>
    const state = { tasks: [], filter: 'all' };
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');
    const filterButtons = document.querySelectorAll('.filter-btn');

    function renderTasks() {
      const filteredTasks = state.tasks.filter(task => {
        if (state.filter === 'active') return !task.completed;
        if (state.filter === 'completed') return task.completed;
        return true;
      });

      taskList.innerHTML = '';
      if (filteredTasks.length === 0) {
        taskList.innerHTML = '<li class="empty">No tasks found. Add a task to get started.</li>';
        return;
      }

      filteredTasks.forEach(task => {
        const item = document.createElement('li');
        item.className = `task-item${task.completed ? ' completed' : ''}`;
        item.innerHTML = `
          <label>
            <input type="checkbox" data-id="${task.id}" ${task.completed ? 'checked' : ''} />
            <span>${task.title}</span>
          </label>
          <button class="task-action" data-id="${task.id}">${task.completed ? 'Undo' : 'Complete'}</button>
        `;
        taskList.appendChild(item);
      });
    }

    function addTask() {
      const title = taskInput.value.trim();
      if (!title) return;
      state.tasks.push({ id: Date.now().toString(), title, completed: false });
      taskInput.value = '';
      renderTasks();
    }

    function setFilter(filter) {
      state.filter = filter;
      filterButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
      renderTasks();
    }

    function toggleTask(id) {
      const task = state.tasks.find(item => item.id === id);
      if (!task) return;
      task.completed = !task.completed;
      renderTasks();
    }

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', event => { if (event.key === 'Enter') addTask(); });
    filterButtons.forEach(button => button.addEventListener('click', () => setFilter(button.dataset.filter)));
    taskList.addEventListener('click', event => {
      const id = event.target.dataset.id;
      if (!id) return;
      toggleTask(id);
    });

    renderTasks();
  </script>
</body>
</html>
